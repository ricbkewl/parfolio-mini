<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ParFolio Mini</title>
  <desc id="desc">Emerald and champagne gold ParFolio Mini golf crest</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#176347"/>
      <stop offset=".48" stop-color="#073e2c"/>
      <stop offset="1" stop-color="#012318"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b2"/>
      <stop offset=".26" stop-color="#e9ca6a"/>
      <stop offset=".62" stop-color="#b78627"/>
      <stop offset="1" stop-color="#f2d77f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset=".34" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ball" cx="34%" cy="28%" r="72%">
      <stop offset="0" stop-color="#fffdf1"/>
      <stop offset=".72" stop-color="#dfd6ae"/>
      <stop offset="1" stop-color="#a99962"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00150d" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="28" y="28" width="456" height="456" rx="112"/></clipPath>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="122" fill="#052d20" filter="url(#shadow)"/>
  <rect x="26" y="26" width="460" height="460" rx="116" fill="url(#bg)" stroke="url(#gold)" stroke-width="10"/>
  <rect x="37" y="37" width="438" height="438" rx="106" fill="none" stroke="#fff5c7" stroke-opacity=".42" stroke-width="3"/>
  <rect x="45" y="45" width="422" height="422" rx="100" fill="none" stroke="#00180f" stroke-opacity=".65" stroke-width="7"/>
  <path d="M79 49h309c48 0 72 19 82 51" fill="none" stroke="#fff4c2" stroke-opacity=".56" stroke-width="8" stroke-linecap="round"/>
  <path d="M55 378c8 53 27 79 68 91" fill="none" stroke="#edc565" stroke-opacity=".42" stroke-width="6" stroke-linecap="round"/>
