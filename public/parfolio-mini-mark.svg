    <path d="M-30 427c112-86 206-31 288-61 87-32 137-84 284-48v209H-30Z" fill="#063725"/>
    <path d="M-6 404c110-44 181-7 252-27 95-27 167-91 280-55" fill="none" stroke="#d7ba58" stroke-opacity=".5" stroke-width="3"/>
    <path d="M52 44h350c-71 24-147 58-212 115-48 42-75 84-113 120-23 22-38 24-50 22V92c0-28 9-42 25-48Z" fill="url(#glass)" opacity=".85"/>
  </g>
  <g filter="url(#glow)" fill="url(#gold)">
    <path d="M151 146h92c77 0 125 35 125 98 0 55-42 92-108 97l-35 3v76h-74V146Zm74 61v79h28c28 0 44-14 44-40 0-25-16-39-44-39h-28Z"/>
