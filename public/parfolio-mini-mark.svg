      <circle cx="-22" cy="0" r="3.4"/><circle cx="-6" cy="-1" r="3.4"/><circle cx="10" cy="1" r="3.4"/><circle cx="25" cy="4" r="3.4"/>
      <circle cx="-15" cy="15" r="3.4"/><circle cx="2" cy="17" r="3.4"/><circle cx="18" cy="15" r="3.4"/>
