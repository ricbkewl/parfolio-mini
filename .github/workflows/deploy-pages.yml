name: Deploy ParFolio Mini to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm run build -- --base=/parfolio-mini/
      - name: Verify built public assets
        run: |
          test -f dist/9B68D5FF-8CCE-40FA-8F35-7F5828913002.png
          test -f dist/parfolio-mini-logo-v2.png
          test -f dist/golf-horizon.svg
          test -f dist/apple-touch-icon.png
          test -f dist/parfolio-mini.webmanifest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
